[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lovefengis"
version = "1.0.0"
description = "Official Python client for the lovefengis REST API: services and prices of lovefengis (software studio, Izmir, Turkey). Read-only, no API key."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "lovefengis", email = "hello@lovefengis.com" }]
keywords = ["lovefengis", "api", "sdk", "pricing", "mcp"]
dependencies = []

[project.urls]
Homepage = "https://lovefengis.com"
Documentation = "https://lovefengis.com/gelistirici/api"
Repository = "https://github.com/systemonster/lovefengis-agents"
