[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lovefengis"
version = "1.0.1"
description = "Services and prices of lovefengis, a remote digital agency serving Turkey. Read-only, no auth."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "lovefengis", email = "hello@lovefengis.com" }]
keywords = ["lovefengis", "api", "sdk", "pricing", "mcp"]
dependencies = []

[project.urls]
Homepage = "https://lovefengis.com"
Documentation = "https://lovefengis.com/gelistirici/api"
Repository = "https://github.com/systemonster/lovefengis-agents"
